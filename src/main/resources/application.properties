spring.application.name=API-Gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ======================================================
# User Service Route (Downstream /api/users/** only)
# Note: /api/auth/** is NOT routed here because AuthController is inside the Gateway
# ======================================================
spring.cloud.gateway.server.webmvc.routes[0].id=user-service-users
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/users/**

# ======================================================
# Product Service Route
# ======================================================
spring.cloud.gateway.server.webmvc.routes[1].id=product-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/products/**

# ======================================================
# Order Service Routes
# ======================================================
spring.cloud.gateway.server.webmvc.routes[2].id=order-service-customer
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.server.webmvc.routes[3].id=order-service-admin
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/admin/orders/**

# ======================================================
# Payment Service Route
# ======================================================
spring.cloud.gateway.server.webmvc.routes[4].id=payment-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/payments/**

# ======================================================
# Notification Service Route
# ======================================================
spring.cloud.gateway.server.webmvc.routes[5].id=notification-service
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/notifications/**

# ======================================================
# Discovery Locator & Logging
# ======================================================
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web.servlet=DEBUG
logging.level.org.springframework.security=TRACE